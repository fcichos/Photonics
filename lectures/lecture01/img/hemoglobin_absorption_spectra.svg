 <title>Oxy and Deoxy Hemoglobin Near-Infrared absorption spectra</title>
 <desc>Absorption spectra of oxygenated hemoglobin (HbO&#8322;) and deoxygenated hemoglobin (Hb) for Near-infrared wavelengths (NIR) redrawn by CMG Lee based on http://commons.wikimedia.org/wiki/File:Oxy_and_Deoxy_Hemoglobin_Near-Infrared_absorption_spectra.png .</desc>
